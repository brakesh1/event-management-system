services:

  mysql:
    image: mysql:8.0
    container_name: event_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: event_management_system
      MYSQL_USER: eventuser
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD}"
        ]
      timeout: 20s
      retries: 10
      interval: 5s

    networks:
      - event_network


  backend:
    build:
      context: ./backend

    container_name: event_backend
    restart: unless-stopped

    environment:
      DATABASE_URL: mysql+pymysql://eventuser:${MYSQL_PASSWORD}@mysql:3306/event_management_system
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}

    depends_on:
      mysql:
        condition: service_healthy

    ports:
      - "8000:8000"

    networks:
      - event_network


  frontend:
    build:
      context: ./frontend

    container_name: event_frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"

    networks:
      - event_network


volumes:
  mysql_data:


networks:
  event_network:
